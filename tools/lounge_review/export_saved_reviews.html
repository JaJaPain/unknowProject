<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Export Lounge Reviews</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111e;color:#eef5ff;font:20px/1.5 system-ui}.card{max-width:680px;padding:34px;background:#0d1929;border:1px solid #4aa2c8;border-radius:14px}button{font:inherit;font-weight:800;padding:14px 22px;border:0;border-radius:9px;background:#64d895;color:#062113;cursor:pointer}.note{color:#a9c4e9}</style>
<main class="card"><h1>Saved lounge review recovery</h1><p id="status">Checking saved reviews…</p><button id="send" hidden>Send saved reviews to Codex</button><iframe id="handoff" name="handoff" hidden></iframe><p class="note">This copies only your Pass/Fail/rewrite choices to the local SpaceGame review folder.</p></main>
<script>
(()=>{const status=document.getElementById('status'),button=document.getElementById('send');let reviews=[];try{reviews=Object.keys(localStorage).filter(k=>k.startsWith('lounge-review:')).map(k=>({batch_id:k,decisions:JSON.parse(localStorage.getItem(k)||'{}')})).filter(x=>Object.keys(x.decisions).length)}catch(error){status.textContent='This browser did not expose the saved review data: '+error.message;return}const count=reviews.reduce((n,x)=>n+Object.keys(x.decisions).length,0);status.textContent=count?`Found ${count} saved review choices. Click once to hand them to the local project.`:'No saved review choices were found in this browser.';button.hidden=!count;button.onclick=()=>{reviews.forEach(payload=>{const form=document.createElement('form');form.method='POST';form.action='http://127.0.0.1:8765/api/save-review';form.target='handoff';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(form);form.submit();form.remove()});button.disabled=true;status.textContent=`Sent ${count} saved choices. You can close this recovery page.`}})();
</script></html>
