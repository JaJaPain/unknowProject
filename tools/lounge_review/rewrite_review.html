<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lounge Rewrite Review</title><style>
body{margin:0;background:#08111e;color:#eef5ff;font:18px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.card{background:#0d1929;border:1px solid #335477;border-radius:14px;padding:22px;margin:18px 0}.meta{color:#9fc5f4}.label{color:#42dde1;font-weight:800;text-transform:uppercase;font-size:.8em;letter-spacing:.08em}.raw{border-color:#79524c}.rewrite{border-color:#32b8ba}.line{margin:12px 0}.buttons{display:flex;gap:12px}.buttons button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:14px;flex:1;cursor:pointer}.use{background:#63d792}.edit{background:#ff767d}textarea{box-sizing:border-box;width:100%;min-height:80px;background:#07101c;color:#fff;border:1px solid #537397;border-radius:8px;padding:10px;font:inherit;margin:6px 0}#load{margin:12px 0}.hidden{display:none}</style></head>
<body><main class="wrap"><div class="top"><div><h1>Lounge rewrite review</h1><p id="progress">Loading the prepared comparisons…</p></div><button id="previous">Previous</button></div><input id="load" type="file" accept="application/json"><section id="page"></section></main>
<script>
(()=>{let items=[],i=0,decisions={};const $=x=>document.getElementById(x),page=$('page'),progress=$('progress');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function text(block,title){return `<div class="line"><div class="label">${title}</div>${esc(block)}</div>`}
function render(){if(!items.length)return;let x=items[i],r=x.assistant_rewrite,s=x.original,d=decisions[x.id];progress.textContent=`${Object.keys(decisions).length} / ${items.length} decided — comparison ${i+1}`;page.innerHTML=`<div class="card"><div class="meta">${esc(x.contact_name)} · ${esc(x.contact_role)} · ${esc(x.station)}</div>${text(x.allowed_facts,'Allowed situation')} ${text(x.player_question,'Player question')}</div><div class="card raw"><h2>Raw model output</h2>${text(s.opener,x.contact_name)}${text(s.answer,x.contact_name+' answer')}${text(s.close,'Conversation close')}</div><div class="card rewrite"><h2>Assistant rewrite</h2><p>${esc(x.review_reason)}</p>${text(r.opener,x.contact_name)}${text(r.answer,x.contact_name+' answer')}${text(r.close,'Conversation close')}</div><div class="buttons"><button class="use" id="original">Use original</button><button class="use" id="use">Use assistant rewrite</button><button class="edit" id="edit">Needs my rewrite</button></div><div id="editor" class="card hidden"><h2>Your revision</h2><textarea id="o">${esc(d?.opener||r.opener)}</textarea><textarea id="a">${esc(d?.answer||r.answer)}</textarea><textarea id="c">${esc(d?.close||r.close)}</textarea><button id="save">Save revision and advance</button></div>`;$('original').onclick=()=>{decisions[x.id]={decision:'original'};advance()};$('use').onclick=()=>{decisions[x.id]={decision:'assistant_rewrite'};advance()};$('edit').onclick=()=>$('editor').classList.remove('hidden');$('save').onclick=()=>{decisions[x.id]={decision:'user_rewrite',opener:$('o').value,answer:$('a').value,close:$('c').value};advance()}}
function advance(){let next=items.findIndex((x,n)=>n>i&&!decisions[x.id]);i=next<0?Math.min(i+1,items.length-1):next;render()}
function load(data){items=data.items||[];i=0;decisions={};render()}
$('previous').onclick=()=>{i=Math.max(0,i-1);render()};$('load').onchange=e=>{let f=e.target.files[0];if(f)f.text().then(x=>load(JSON.parse(x)))};
const batchFile=new URLSearchParams(location.search).get('batch')||'lounge_assistant_rewrite_review.json';
fetch(batchFile).then(r=>r.ok?r.json():Promise.reject()).then(load).catch(()=>progress.textContent='Open this page through Lounge.bat, or choose the prepared review JSON below.');})();
</script></body></html>
